services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_testing_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ati} -d ${POSTGRES_DB:-ai_testing_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ati-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_testing_intelligence}
      ATI_JWT_SECRET: ${ATI_JWT_SECRET:?Set ATI_JWT_SECRET in .env}
      ATI_TESTING_RELEVANCE_THRESHOLD: ${ATI_TESTING_RELEVANCE_THRESHOLD:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_testing_intelligence}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      ATI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ati}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_testing_intelligence}
      ATI_ANALYSIS_API_BASE_URL: ${ATI_ANALYSIS_API_BASE_URL:-}
      ATI_ANALYSIS_API_KEY: ${ATI_ANALYSIS_API_KEY:-}
      ATI_ANALYSIS_MODEL: ${ATI_ANALYSIS_MODEL:-}
      ATI_ANALYSIS_BATCH_SIZE: ${ATI_ANALYSIS_BATCH_SIZE:-10}
      ATI_TESTING_RELEVANCE_THRESHOLD: ${ATI_TESTING_RELEVANCE_THRESHOLD:-60}
      ATI_ANALYSIS_FETCH_FULL_CONTENT: ${ATI_ANALYSIS_FETCH_FULL_CONTENT:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
