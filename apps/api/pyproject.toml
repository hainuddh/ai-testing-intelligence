[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-testing-intelligence-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.4",
  "PyJWT==2.13.0",
  "pwdlib[argon2]==0.3.1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
  "redis==5.3.1",
  "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
